[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "genai-retail-forecasting"
version     = "1.0.0"
description = "Production-grade GenAI retail demand forecasting pipeline"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "bq*", "config*", "db*", "etl*", "pipeline*", "rag*"]

# ── Dependency groups ──────────────────────────────────────────
[project.optional-dependencies]
base = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
]
etl = [
  "apache-beam[gcp]>=2.55",
  "google-cloud-storage>=2.16",
  "google-cloud-bigquery>=3.19",
  "pyarrow>=15.0",
]
rag = [
  "langchain>=0.2",
  "langchain-core>=0.2",
  "langchain-community>=0.2",
  "langchain-text-splitters>=0.2",
  "langchain-huggingface>=0.0.3",
  "langchain-groq>=0.1.9",
  "faiss-cpu>=1.7",
  "sentence-transformers>=2.7",
  "pypdf>=4.2",
  "tenacity>=8.3",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "tenacity>=8.3",
]
ui = [
  "streamlit>=1.35",
  "plotly>=5.22",
  "requests>=2.31",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "anyio>=4.4",
  "aiosqlite>=0.20",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-setuptools",
  "respx>=0.21",
]

# ── Tooling ────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore  = ["S101"]   # allow assert in tests

[tool.mypy]
python_version      = "3.12"
strict              = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "migrations/*", "scripts/*"]
